name: Checar se compila

# Só compila o front e o Rust (sem gerar instalador nem publicar nada), a cada push na main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
