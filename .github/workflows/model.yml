name: Coletar partidas e treinar o modelo

# Roda 4 vezes por dia (22h, 4h, 10h e 16h de Brasília) pra usar a chave o dia todo;
# pode ser disparado à mão na aba Actions. Uma rodada espera a outra terminar.
# Precisa do segredo RIOT_API_KEY (Settings -> Secrets and variables -> Actions).
# Os dados e o modelo ficam na branch "data", que é refeita a cada rodada.
on:
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      horas:
        description: "Horas de coleta nesta rodada"
        default: "5"

permissions:
  contents: write

concurrency:
  group: modelo
  cancel-in-progress: false

jobs:
  coletar-e-treinar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy

      - name: Recupera os dados das rodadas anteriores
        run: |
          mkdir -p model/data model/out
          if git ls-remote --exit-code origin data >/dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD model/data model/out | tar -x || true
          fi
          ls -la model/data || true

      - name: Coleta partidas (Mestre+ e Diamante 1, BR)
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python model/collect.py --d1 --hours "${{ github.event.inputs.horas || '5' }}"

      - name: Treina
        working-directory: model
        run: python train.py

      - name: Runas, builds e counters
        working-directory: model
        run: python builds.py

      - name: Força por duração de jogo (plano de jogo)
        working-directory: model
        run: python scaling.py

      - name: Lane em ouro aos 15 e sup contra ADC inimigo
        working-directory: model
        run: python lane.py

      - name: Médias Mestre+ pra revisão pós-jogo
        working-directory: model
        run: python bench.py

      - name: Salva dados e modelo na branch data
        if: always()
        run: |
          set -e
          D=$(mktemp -d)
          mkdir -p "$D/model"
          cp -r model/data model/out "$D/model/" 2>/dev/null || true
          cd "$D"
          git init -q -b data
          git config user.name "helporoLOL bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Dados e modelo $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data

      - name: Relatório no resumo da rodada
        if: always()
        run: cat model/out/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelo
          path: model/out
