name: Publicar no GitHub Pages

# A página do celular (abre o coach ao vivo do PC) na raiz, a demonstração e o draft web em /draft.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Monta o site
        run: |
          mkdir -p site/draft
          cp -r dist/. site/draft/
          cp pages/index.html site/index.html
          cp src-tauri/assets/timer.html site/ao-vivo-demo.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
