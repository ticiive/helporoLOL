name: Build do app (Windows)

# Roda quando você cria uma tag v* (ex.: v0.1.0) ou manualmente pela aba Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: helporoLOL ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: Baixe o instalador `_x64-setup.exe` abaixo. Primeira abertura no Windows, veja o README.
          releaseDraft: false
          prerelease: false
